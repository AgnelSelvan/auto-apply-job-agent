[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-apply-job-agent"
version = "0.1.0"
description = "Search LinkedIn jobs via SearXNG and scrape details"
authors = [{name = "Developer"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pandas>=1.5.0",
    "openpyxl>=3.0.10",
    "pdflatex>=0.1.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "mypy>=1.0.0"
]

[project.scripts]
auto-apply-job-agent = "apply_for_job.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
